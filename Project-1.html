<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Project</title>
    <link rel="stylesheet" href="/style1.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="header_top">
        <div class="container-fluid d-flex align-items-center text-bg-secondary">
            <a href="" class="text-white text-decoration-none mx-5 my-2">
                <img src="/Images/Mailbox.png" height="20" width="20" class="" alt="">
                info@shipmystuff.co.za
            </a>
            <a href="" class="text-white text-decoration-none ml-5">
                <img src="/Images/Phone.png" height="15" width="20" class=" " alt="">
                (+27) 71 332 8391
            </a>
        </div>
        <div class="ml-auto header_top_right">
        </div>
    </div>

    <header class="main_header sticky">
        <nav class="d-inline bg-white navbar-expand navabar-light">
            <div class="d-flex align-items-center justify-content-between mx-5 container">
                <div>
                    <a href="" class="navabar-brand">
                        <img src="/Images/Navbar Brand.png" height="60" width="200" class="ml-5" alt="">
                    </a>
                </div>

                <div class="collapse navbar-collapse">
                    <div class="w-100 d-flex justify-content-center align-items-center">
                        <ul class="d-flex justify-content-center align-items-center navbar-nav">
                            <li class="nav-item px-3">
                                <a href="" class="nav-link text-success">Home</a>
                            </li>
                            <li class="nav-item px-3">
                                <a href="" class="nav-link text-success">Services</a>
                            </li>
                            <li class="nav-item px-3">
                                <a href="" class="nav-link text-success">Resources</a>
                            </li>
                            <li class="nav-item px-3">
                                <a href="" class="nav-link text-success">Contact Us</a>
                            </li>
                            <li class="nav-item px-3">
                                <a href="" class="nav-link text-success">Track Parcel</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <hr>
        </nav>
    </header>

    <div class="d-flex w-100">
        <div id="Carousel" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="/Images/Banner_SA.e43dea10.jpg" height="5%" width="1260px" alt="">
                </div>
                <div class="carousel-item">
                    <img src="/Images/Banner2.png" height="5%" width="1260px" alt="">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#Carousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#Carousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>

</body>

</html>
