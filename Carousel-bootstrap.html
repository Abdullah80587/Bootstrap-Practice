<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container">
        <h1 class="py-3 text-center">Bootstrap Carousel</h1>
        <div class="row py-3">
            <div class="col">
                <div id="mycarousel" class="carousel slide carousel-fade">
                    <ol class="carousel-indicators">
                        <li data-bs-target="#mycarousel" data-bs-slide-to="0" class="active"></li>
                        <li data-bs-target="#mycarousel" data-bs-slide-to="1"></li>
                        <li data-bs-target="#mycarousel" data-bs-slide-to="2"></li>
                    </ol>
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="/Bootstrap-Practice/Images/Pic 1.avif" class="d-block w-100" alt="">
                            <div class="carousel-caption d-none d-md-block">
                                <h5>First Slide label</h5>
                                <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit.</p>
                            </div>
                        </div>

                        <div class="carousel-item">
                            <img src="/Bootstrap-Practice/Images/pic 2.avif" class="d-block w-100" alt="">
                            <div class="carousel-caption d-none d-md-block">
                                <h5>Second Slide label</h5>
                                <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit.</p>
                            </div>
                        </div>

                        <div class="carousel-item">
                            <img src="/Bootstrap-Practice/Images/pic 3.avif" class="d-block w-100" alt="">
                            <div class="carousel-caption d-none d-md-block">
                                <h5>Third Slide label</h5>
                                <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit.</p>
                            </div>
                        </div>
                    </div>
                    <a href="#mycarousel" class="carousel-control-prev" data-bs-target="#mycarousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </a>

                    <a href="#mycarousel" class="carousel-control-next" data-bs-target="#mycarousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </a>

                </div>
            </div>
        </div>
    </div>
