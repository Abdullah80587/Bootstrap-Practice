<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <div class="container">
        <div class="row py-3">
            <div class="col">
                <label for="exampleformemail" class="for-label">Email Address:-</label>
                <input type="email" class="form-control" id="exampleformemail" placeholder="name@gmail.com">
            </div>
            <div class="row py-3">
                <div class="col-lg-12">
                    <label for="inputpassword" class="for-label">Enter Password</label>
                    <input type="password" class="form-control" id="inputpassword">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="textarea" class="for-label">About Me</label>
                    <input type="text" class="form-control" id="textarea">
                </div>
            </div>
            <button type="submit" class=" btn btn-outline-warning m-3 col-1">SUBMIT</button>
            <div class="row">
                <div class="col">
                    <select class="form-select">
                        <option value="selected">Open the select menu</option>
                        <option value="1">One</option>
                        <option value="2">Two</option>
                        <option value="3">Three</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="form-check">
                        <input type="checkbox" class="form-check" id="checkchecked">
                        <label for="checkchecked" class="form-label">Default Check</label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="username" aria-label="username"
                            aria-describedby="username">
                        <span class="input-group-text" id="basic-addon1">@</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
