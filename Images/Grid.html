<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            /* grid-template-columns ma ham jitni b values dein gay utny columns bna jayein gay */
            /* grid-template-rows:; */
            grid-gap: 20px;
            /* grid-auto-rows: 100px; */
            /* grid-auto-columns: 20px; */
            grid-auto-rows: minmax(100px, auto);
            grid-auto-columns: minmax(50px, auto);
        }

        .items {
            background-color: lightcoral;
            border: 3px solid green;
            border-radius: 3px;
        }

        #item-2 {
            grid-row-start: 2;
            grid-row-end: 3;
            grid-column-start: 2;
            grid-column-end: 3;
        }

        #item-1 {
            grid-row-start: 1;
            grid-row-end: 4;
        }

        .item-1-container {
            display: grid;
        }

        .nested-item {
            border: 3px solid greenyellow;
            border-radius: 3px;
            background-color: lightgoldenrodyellow;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="items item-1-container" id="item-1">
            <div class="nested-item">Dabba mai dabba 1</div>
            <div class="nested-item">Dabba mai dabba 2</div>
            <div class="nested-item">Dabba mai dabba 3</div>
        </div>
        <div class="items" id="item-2">Dabba 2</div>
        <div class="items">Dabba 3</div>
        <div class="items">Dabba 4</div>
        <div class="items">Dabba 5</div>
    </div>

</body>

</html>
