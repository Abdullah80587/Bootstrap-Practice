<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    Static Position: by deflaut
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .parent {
            padding: 43px;
            margin: 34px;
            border: 2px solid purple;
            /* position: relative; */
            /* transform, filter and perspective ya 3 properties same positioned ki tarah work krti haan  */
            /* transform: translate(0); */
            /* filter: invert(0); */
            perspective: 0em;

        }


        .box {
            border: 2px solid black;
            height: 233px;
            width: 80vw;
            margin: 3px;
            padding: 3px;

        }

        .box1 {
            background-color: aqua;
            position: static;
            top: 20px;
            /* static position bydefault, normal flow hoti ha. jo top, left sy change nhi hoti..*/
        }

        .box2 {
            background-color: blueviolet;
            /*position relative ma top,bottom deny sy ya jaga change kr ly ga*/
            /* z-index sy ham is ko box1 ky uper ya neechy show kr sacty haan.. */
            position: relative;
            top: 34px;
            left: 56px;
        }

        .box3 {
            background-color: pink;
            position: fixed;
            /* position fixed sy box3 fixed ho jaye ga or top deny wo kuch scroll ho ga, phir fixed ho jaye ga.. */
            /* top: 0px; */
        }

        .box4 {
            background-color: red;
            position: sticky;
            /* position sticky sy box4 jahan ham is ko set krn gay wahan stick ho jaye ga or page ky sath scroll ho ga.. */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
