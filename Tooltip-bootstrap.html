<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltips in Bootstrap</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
</head>

<body>
    <!-- Tooltip bascially aik button ha jis per hover krny sy kuch message show krwa sacty haan.... 
    wo message ham left, right, top, bottom pr show krwa sacty haan -->
    <div class="container mb-5">
        <h2 class="py-3 text-center">Bootstrap Tooltips</h2>
        <div class="row py-3">
            <div class="col-md-7 mx-auto">
                <button type="button" class="btn btn-primary" title="Tooltip on top" data-bs-placement="top"
                    data-bs-toggle="tooltip">Tooltip 1</button>
                <button type="button" class="btn btn-primary" title="Tooltip on bottom" data-bs-placement="bottom"
                    data-bs-toggle="tooltip">Tooltip 2</button>
                <button type="button" class="btn btn-primary" title="Tooltip on left" data-bs-placement="left"
                    data-bs-toggle="tooltip">Tooltip 3</button>
                <button type="button" class="btn btn-primary" title="tooltip on right" data-bs-placement="right"
                    data-bs-toggle="tooltip">tooltip 4</button>
            </div>
        </div>
    </div>

    <script>
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
    </script>

</body>

</html>
