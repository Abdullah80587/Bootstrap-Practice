<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popover Bootstrap</title>
    <link rel="stylesheet" href="bootstrap.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(function () {
            $('[data-toggle="popover"]').popover();
        });
    </script>
</head>

<body>
    <div class="container">
        <h2 class="py-3 text-center">Bootstrap Popover</h2>
        <div class="row py-5">
            <div class="col-md-7 mx-auto">
                <button type="button" class="btn btn-primary" data-bs-container="body" data-bs-placement="bottom"
                    data-bs-toggle="popover" title="popover title"
                    data-bs-content="Lorem ipsum, dolor sit amet consectetur adipisicing elit. Dolores, ducimus?">popover</button>
            </div>
        </div>
    </div>

</body>

</html>
